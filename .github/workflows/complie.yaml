name: Compile AGLIO Firmware
on:
  push:
    branches: [vial]
  pull_request:
    branches: [vial]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install QMK CLI
        run: pip install qmk
      - name: Compile AGLIO VIAL (UF2)
        run: qmk compile -kb BARAM-GH60-313SPLITSPC -km vial -e UF2
      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BARAM-GH60-313SPLITSPC-uf2
          path: BARAM-GH60-313SPLITSPC_vial.uf2 
