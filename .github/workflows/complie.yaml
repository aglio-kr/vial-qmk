name: Compile aglio Firmware
on:
  push:
    branches: [vial]
  pull_request:
    branches: [vial]
  workflow_dispatch:  # 수동 실행 가능
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install QMK CLI
        run: pip install qmk
      - name: Install ARM GCC Toolchain
        uses: xpack/setup-arm-none-eabi-gcc@v2  # 대체 액션 사용
        with:
          version: '12.2.rel1'  # RP2040 호환 최신 버전
      - name: Compile aglio VIAL (UF2)
        run: qmk compile -kb aglo -km vial -e UF2
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aglio-uf2
          path: aglio_vial.uf2
